name: Lint Auto-Fix

# Hosted contingency for the former lint repair loop. Navigate owns bounded
# local repair and exact-SHA revalidation without consuming Actions minutes.
#
# Safety:
# * Only runs on PRs from branches in the SAME repo (not forks), so we
#   never push to untrusted branches.
# * Only runs when api/ or app/ files actually changed.
# * Idempotent — if nothing to fix, no-op.

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lint-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ruff-autofix:
    name: Ruff auto-fix (api/)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff (must match api/.github CI pin)
        run: pip install ruff==0.15.13

      - name: Run ruff check --fix
        working-directory: api
        run: ruff check --fix app/ main.py || true

      - name: Run ruff format
        working-directory: api
        run: ruff format app/ main.py || true

      - name: Commit + push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(lint): ruff --fix + format (auto)"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            echo "::notice::Auto-fix commit pushed."
          else
            echo "::notice::Nothing to fix."
          fi

  prettier-autofix:
    name: Prettier auto-fix (app/)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Detect prettier
        id: detect
        run: |
          if [ -f app/.prettierrc ] || [ -f app/.prettierrc.json ] || [ -f app/prettier.config.js ] || grep -q '"prettier"' app/package.json 2>/dev/null; then
            echo "has_prettier=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_prettier=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run prettier --write
        if: steps.detect.outputs.has_prettier == 'true'
        working-directory: app
        run: |
          npm ci --prefer-offline --no-audit
          npx prettier --write "src/**/*.{ts,tsx,css}" || true

      - name: Commit + push if anything changed
        if: steps.detect.outputs.has_prettier == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(lint): prettier --write (auto)"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            echo "::notice::Prettier auto-fix commit pushed."
          else
            echo "::notice::Nothing to fix."
          fi
