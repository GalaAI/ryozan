name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
  # gate.yml calls this too. The direct triggers stay until main's branch
  # protection requires gate instead of this workflow's job names.
  workflow_call:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when gate runs this, so the two runs
  # never cancel each other.
  group: frontend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR pushes are cancelled; every commit on main gets a full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Frontend Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Runs before npm ci: if packages/ui/src and the vendored tarball have
      # diverged, npm ci would install the stale component and every later step
      # would pass against code that is not what the source says. Node stdlib
      # only, so it needs no install.
      - name: "@ryozan/ui tarball parity"
        run: npm run check:ui-tarball

      - run: npm ci

      # Ryozan Modern Classic: lints app/src against the source config in
      # packages/ui (not the installed tarball) so a config change gates on the
      # same PR that makes it. Blocking: app/src reports zero errors today.
      - name: Design-system adherence lint
        run: npm run lint:adherence:src

      - name: TypeScript type check
        run: npx tsc -b --noEmit

      # `npm run lint` runs the node:test suites (booking conversion, booking
      # approval, analytics privacy) before ESLint.
      - name: Unit tests and ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

