name: Frontend CI

on:
  # Hosted-runner contingency only. Navigate publishes this required context
  # from the Ark execution sandbox for every PR head SHA.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frontend Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Runs before npm ci: if packages/ui/src and the vendored tarball have
      # diverged, npm ci would install the stale component and every later step
      # would pass against code that is not what the source says. Node stdlib
      # only, so it needs no install.
      - name: "@bttco/ui tarball parity"
        run: npm run check:ui-tarball

      - run: npm ci

      # BTTCO Modern Classic: lints app/src against the source config in
      # packages/ui (not the installed tarball) so a config change gates on the
      # same PR that makes it. Blocking: app/src reports zero errors today.
      - name: Design-system adherence lint
        run: npm run lint:adherence:src

      - name: TypeScript type check
        run: npx tsc -b --noEmit


      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

  # Frontend deployment is owned by Vercel's native Git integration after an
  # authorized PR reaches main. Navigate observes the resulting production
  # deployment and live surface before allowing another managed merge.
