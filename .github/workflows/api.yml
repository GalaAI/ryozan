name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR pushes are cancelled; every commit on main gets a full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Backend Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies and pinned Ruff
        run: pip install -r requirements.txt ruff==0.15.13

      - name: Ruff lint
        run: ruff check app/ main.py

      - name: Ruff format check
        run: ruff format --check app/ main.py

      - name: Syntax check (all API and test modules)
        # A bad find-and-replace once left an invalid identifier in config.py and
        # two test files; py_compile on main.py alone never saw the tests.
        run: python -m compileall -q main.py app tests scripts

      - name: Import all endpoint modules
        run: |
          python -c "
          import importlib, sys
          modules = [
            'app.api.v1.router',
            'app.api.v1.endpoints.admin_api_usage',
            'app.api.v1.endpoints.ai',
            'app.api.v1.endpoints.ai_memories',
            'app.api.v1.endpoints.archive',
            'app.api.v1.endpoints.artists',
            'app.api.v1.endpoints.auth',
            'app.api.v1.endpoints.bookings',
            'app.api.v1.endpoints.broadcasts',
            'app.api.v1.endpoints.calendar',
            'app.api.v1.endpoints.club',
            'app.api.v1.endpoints.conversations',
            'app.api.v1.endpoints.dashboard',
            'app.api.v1.endpoints.documents',
            'app.api.v1.endpoints.email_automations',
            'app.api.v1.endpoints.email_connect',
            'app.api.v1.endpoints.email_inbound',
            'app.api.v1.endpoints.email_log',
            'app.api.v1.endpoints.email_templates',
            'app.api.v1.endpoints.flash',
            'app.api.v1.endpoints.google_auth',
            'app.api.v1.endpoints.messages',
            'app.api.v1.endpoints.notification_preferences',
            'app.api.v1.endpoints.notifications',
            'app.api.v1.endpoints.gala_chat',
            'app.api.v1.endpoints.plaid',
            'app.api.v1.endpoints.pos',
            'app.api.v1.endpoints.push',
            'app.api.v1.endpoints.quests',
            'app.api.v1.endpoints.quotes',
            'app.api.v1.endpoints.references',
            'app.api.v1.endpoints.response_templates',
            'app.api.v1.endpoints.scrolls',
            'app.api.v1.endpoints.session_types',
            'app.api.v1.endpoints.stripe_connect',
            'app.api.v1.endpoints.stripe_webhooks',
            'app.api.v1.endpoints.users',
            'app.api.v1.endpoints.waiver',
          ]
          failed = []
          for m in modules:
            try:
              importlib.import_module(m)
              print(f'  OK: {m}')
            except Exception as e:
              print(f'  FAIL: {m} - {e}')
              failed.append(m)
          if failed:
            print(f'\n{len(failed)} module(s) failed to import.')
            sys.exit(1)
          print(f'\nAll {len(modules)} modules imported successfully.')
          "

      - name: Import all models
        run: python -c "import app.models; print('All models loaded successfully')"

      - name: Router route count
        run: |
          python -c "
          from fastapi import FastAPI
          from app.api.v1.router import api_router
          app = FastAPI(); app.include_router(api_router, prefix='/api/v1')
          n = sum(len(v) for v in app.openapi()['paths'].values())
          print(f'Router loaded: {n} operations')
          assert n > 100
          "

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "*_tests.py"

  migrations:
    name: Schema boot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    # The schema has one path: `alembic upgrade head`, which the container runs
    # before uvicorn starts. This job builds an empty Postgres exactly that way,
    # proves the result is the baseline snapshot, proves adoption of a database
    # built by the old boot path, runs the startup data seeds, and checks every
    # model column exists, so a model change without a revision fails the PR.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexus
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/nexus
      DATABASE_SYNC_URL: postgresql://postgres:postgres@localhost:5432/nexus
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Single migration head
        run: |
          heads=$(python -m alembic heads | grep -c '(head)')
          echo "alembic heads: $heads"
          test "$heads" -eq 1

      - name: Booking approval integration
        env:
          BTTCO_TEST_DATABASE_URL: ${{ env.DATABASE_SYNC_URL }}
        run: python -m unittest discover -s tests -p "booking_approval_pg_tests.py"

      - name: Courier SMS booking routing integration
        env:
          BTTCO_TEST_DATABASE_URL: ${{ env.DATABASE_SYNC_URL }}
        run: python -m unittest discover -s tests -p "courier_sms_booking_routing_pg_tests.py"

      - name: POS attempt integration
        env:
          BTTCO_TEST_DATABASE_URL: ${{ env.DATABASE_SYNC_URL }}
        run: python -m unittest discover -s tests -p "pos_attempt_pg_tests.py"

      - name: Booky courier integration
        env:
          BTTCO_TEST_DATABASE_URL: ${{ env.DATABASE_SYNC_URL }}
        run: python -m unittest discover -s tests -p "booky_courier_pg_tests.py"

      - name: Gala schedule integration
        env:
          BTTCO_TEST_DATABASE_URL: ${{ env.DATABASE_SYNC_URL }}
        run: python -m unittest discover -s tests -p "gala_schedule_pg_tests.py"

      - name: Baseline and adoption against a real Postgres
        env:
          BTTCO_TEST_DATABASE_URL: ${{ env.DATABASE_SYNC_URL }}
        run: python -m unittest discover -s tests -p "schema_baseline_pg_tests.py"

      - name: alembic upgrade head on an empty database (the container's path)
        run: |
          psql "$DATABASE_SYNC_URL" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public"
          python -m alembic upgrade head
          python -m alembic current | tee /tmp/current.txt
          grep -q '(head)' /tmp/current.txt

      - name: Startup data seeds
        run: |
          python -c "
          import asyncio
          from main import _run_startup_seeds
          asyncio.run(_run_startup_seeds())
          " | tee /tmp/seeds.txt
          ! grep -q 'Startup seed FAILED' /tmp/seeds.txt

      - name: Core tables exist
        run: |
          python -c "
          import sqlalchemy as sa
          from app.core.config import get_settings
          e = sa.create_engine(get_settings().DATABASE_SYNC_URL)
          names = sa.inspect(e).get_table_names()
          bttco = [n for n in names if n.startswith('bttco_')]
          print(f'bttco tables created: {len(bttco)}')
          missing = {'bttco_users', 'bttco_bookings'} - set(names)
          assert not missing, f'missing core tables: {missing}'
          assert len(bttco) > 40, f'suspiciously few tables: {len(bttco)}'
          "

      - name: Starter quests seeded
        # The starter-quest seed has broken in production before (it omitted the
        # NOT NULL id/is_active/created_at values the schema gives no server
        # default for); requiring the rows proves it ran.
        run: |
          python -c "
          import sqlalchemy as sa
          from app.core.config import get_settings
          e = sa.create_engine(get_settings().DATABASE_SYNC_URL)
          with e.connect() as c:
              n = c.execute(sa.text('SELECT count(*) FROM bttco_quests')).scalar()
          assert n > 0, 'bttco_quests is empty after the startup seeds; the seed INSERT failed.'
          print(f'starter quests seeded: {n}')
          "

      - name: Built-in scroll categories seeded at startup
        # Without these rows every /scrolls/{category_slug} lookup 404s. Six of
        # the seven mirror ScrollsPanel.tsx BUILTIN_CATEGORIES (a partial seed
        # makes the frontend drop tabs); 'owner-archive' is backend-owned
        # (app/services/scroll_archive.py hardcodes its slug).
        run: |
          python -c "
          import sqlalchemy as sa
          from app.core.config import get_settings
          e = sa.create_engine(get_settings().DATABASE_SYNC_URL)
          with e.connect() as c:
              rows = c.execute(sa.text(
                  'SELECT slug, label, icon, sort_order, is_builtin FROM bttco_scroll_categories '
                  'ORDER BY sort_order'
              )).all()
          got = [tuple(r) for r in rows]
          want = [
              ('artist', 'Artist', '📜', 0, True),
              ('shop', 'Shop', '🏪', 1, True),
              ('templates', 'Templates', 'message-square', 2, True),
              ('waivers', 'Waivers', '📋', 3, True),
              ('upkeep', 'Upkeep', '🔧', 4, True),
              ('quests', 'Quest Log', 'quest', 5, True),
              ('owner-archive', 'Artist Scrolls', 'archive', 6, True),
          ]
          assert got == want, (
              f'built-in scroll categories are wrong after the boot path.\n'
              f'  want: {want}\n  got:  {got}\n'
              'With no rows every scrolls category endpoint returns 404 and the '
              'feature is unusable. With a partial seed the frontend replaces its '
              'six-tab fallback with fewer tabs and the missing ones vanish.'
          )
          print(f'built-in scroll categories seeded: {got}')
          "

      - name: Every model column exists in the database
        run: |
          python -c "
          import sqlalchemy as sa
          from app.core.database import Base
          from app.core.config import get_settings
          from app.api.v1 import router as _r  # noqa: F401  registers every model
          e = sa.create_engine(get_settings().DATABASE_SYNC_URL)
          insp = sa.inspect(e)
          live = set(insp.get_table_names())
          drift = []
          for t in Base.metadata.sorted_tables:
              if t.name not in live:
                  drift.append(f'{t.name}: table missing entirely')
                  continue
              have = {c['name'] for c in insp.get_columns(t.name)}
              for col in t.columns:
                  if col.name not in have:
                      drift.append(f'{t.name}.{col.name}')
          if drift:
              raise SystemExit(
                  'Model declares columns the migrated database does not have. Add an '
                  'Alembic revision; every query touching these would raise UndefinedColumn:\n  '
                  + '\n  '.join(drift)
              )
          print(f'model/database parity OK across {len(Base.metadata.sorted_tables)} tables')
          "

      - name: Router loads against the migrated schema
        run: |
          python -c "
          from fastapi import FastAPI
          from app.api.v1.router import api_router
          app = FastAPI(); app.include_router(api_router, prefix='/api/v1')
          n = sum(len(v) for v in app.openapi()['paths'].values())
          print(f'Router loaded: {n} operations')
          assert n > 100
          "

  ryozan-econ:
    name: Ryozan E-con
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ryozan-econ
    # The bookkeeping core is pure domain logic: no dependencies, no database, no
    # BTTCO imports, so it needs none of the verify job's setup. Its whole value
    # is its invariants -- entries balance, the trial balance ties, the balance
    # sheet ties, a deposit stays a liability until earned -- and those are cheap
    # to prove, so they are proven on every run rather than assumed.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Invariant tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p "*_tests.py" -v

      - name: Lint with the repo ruff config
        run: |
          pip install ruff==0.15.13
          ruff check --config ../../api/ruff.toml .
          ruff format --check --config ../../api/ruff.toml .
