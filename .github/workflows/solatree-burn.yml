name: solatree-burn
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: write
jobs:
  burn:
    # Ryozan is public: a fork PR must never reach a self-hosted runner, so these jobs
    # run on GitHub-hosted runners whatever the runner variables say.
    runs-on: ${{ github.event.repository.visibility != 'public' && (vars.SOLATREE_LIGHT_RUNNER || vars.SOLATREE_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: GalaAI/solatree/actions/burn@ac61b56a126755e3f6c0782a3d0c2c9d2e2ebf79
        with:
          github-token: ${{ github.token }}
