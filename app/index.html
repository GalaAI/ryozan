<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content" />

    <title>Ryozan | Studio operating system on NVIDIA Nemotron</title>
    <meta name="description" content="Ryozan is a multi-agent studio operating system for tattoo studios. Gala and the eight Bandits run bookings, scheduling, Courier messages, commerce and aftercare on NVIDIA Nemotron via Nebius Token Factory." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ryozan | Studio operating system" />
    <meta property="og:description" content="Gala and the eight Bandits of Ryozanpaku run the studio on NVIDIA Nemotron." />
    <meta property="og:site_name" content="Ryozan" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/svg+xml" href="/assets/brand/ryozan-mark.svg" />
    <link rel="apple-touch-icon" href="/assets/brand/ryozan-mark.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b0c0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html[data-ryozan-app-route] { background: #0b0c0b; }
      html[data-ryozan-app-route] #root { min-height: 100dvh; background: #0b0c0b; }
      html[data-ryozan-app-route] [data-static-public-fallback] { display: none !important; }
      [data-static-app-shell] { display: none; }
      html[data-ryozan-app-route] [data-static-app-shell] { display: grid; place-items: center; min-height: 100dvh; background: #0b0c0b; }
      [data-static-app-shell] img { width: 88px; height: 88px; opacity: .9; }
    </style>
    <script>
      if (/^\/(dashboard|portal|login|account)(\/|$)/.test(window.location.pathname)) {
        document.documentElement.setAttribute('data-ryozan-app-route', '');
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking first paint; text swaps in when they arrive. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&family=Poppins:wght@600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&family=Poppins:wght@600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" /></noscript>
    <script defer src="/relic-field.js"></script>
  </head>
  <body>
    <div id="root">
      <!-- App routes paint the seal at once; React replaces it on mount. -->
      <div data-static-app-shell role="status" aria-label="Opening Ryozan"><img src="/assets/brand/ryozan-mark.svg" alt="" /></div>
      <main data-static-public-fallback style="color: #e8dfcf; background: #090a09; font-family: Arial, sans-serif; line-height: 1.6; min-height: 100vh; display: grid; place-items: center; padding: 64px 24px; text-align: center;">
        <div style="max-width: 760px;">
          <img src="/assets/brand/ryozan-mark.svg" alt="Ryozan seal" style="width: 96px; height: 96px;">
          <h1 style="font-size: clamp(36px, 7vw, 64px); line-height: 1; text-transform: uppercase;">Ryozan</h1>
          <p style="font-size: 18px;">The studio operating system run by Gala and the eight Bandits on NVIDIA Nemotron. JavaScript is required to open the portal.</p>
          <p><a href="/portal" style="color: #d38a68; font-weight: 700;">Open the studio portal</a></p>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
