[alembic]
script_location = alembic
prepend_sys_path = .
# Placeholder only. alembic/env.py overwrites this at runtime from
# settings.DATABASE_SYNC_URL (api/.env locally, Railway vars in production),
# so migrations always follow the app's configured database rather than a
# value pinned here. Do not point this at a real database.
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
